<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#02332c" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#011816" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#010e0d" stop-opacity="0.99"/>
    </radialGradient>

    <!-- Emerald Primary Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF97"/>
      <stop offset="50%" stop-color="#00DF82"/>
      <stop offset="100%" stop-color="#007D42"/>
    </linearGradient>

    <!-- Cyan Ambient Gradient -->
    <linearGradient id="cyanGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00FF97" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Gold Accent Gradient for Trust -->
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00FF97" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="emeraldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Obsidian Canvas -->
  <rect width="1920" height="1080" fill="url(#bgGlow)"/>

  <!-- Ambient Light Orbs positioned high behind header -->
  <circle cx="960" cy="240" r="320" fill="#00FF97" fill-opacity="0.08" filter="url(#softGlow)"/>
  <circle cx="700" cy="220" r="220" fill="#00E5FF" fill-opacity="0.05" filter="url(#softGlow)"/>
  <circle cx="1220" cy="220" r="220" fill="#007D42" fill-opacity="0.08" filter="url(#softGlow)"/>

  <!-- Geometric Trust Rings around Handshake -->
  <g opacity="0.14" stroke="url(#emeraldGrad)" stroke-width="1" stroke-dasharray="4 8">
    <circle cx="960" cy="230" r="280"/>
    <circle cx="960" cy="230" r="190"/>
    <line x1="450" y1="230" x2="1470" y2="230"/>
    <line x1="960" y1="20" x2="960" y2="440"/>
  </g>

  <!-- TOP EXECUTIVE HANDSHAKE VECTOR ARTWORK (Positioned high behind title, clearing logo slider) -->
  <g transform="translate(960, 230) scale(1.18)" filter="url(#emeraldGlow)">
    <!-- Central Trust Aura Behind Clasp -->
    <ellipse cx="0" cy="0" rx="130" ry="80" fill="#00FF97" fill-opacity="0.1" filter="url(#softGlow)"/>

    <!-- Left Hand / Cuff (Executive Suit Left) -->
    <path d="M-220,70 L-140,55 L-110,40 L-60,35 L-20,10 L-50,-20 L-95,-10 L-150,-20 L-220,-10 Z" 
          fill="#021C19" stroke="url(#emeraldGrad)" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M-220,15 L-140,18 M-220,42 L-145,36" stroke="#00FF97" stroke-width="1.2" stroke-opacity="0.4"/>
    <polygon points="-140,55 -135,15 -142,-18 -150,-19 -145,52" fill="#00FF97" fill-opacity="0.3"/>

    <!-- Right Hand / Cuff (Executive Suit Right) -->
    <path d="M220,-60 L140,-45 L110,-30 L60,-25 L20,-5 L50,25 L95,15 L150,25 L220,15 Z" 
          fill="#021C19" stroke="url(#cyanGrad)" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M220,-10 L140,-12 M220,-35 L145,-30" stroke="#00E5FF" stroke-width="1.2" stroke-opacity="0.4"/>
    <polygon points="140,-45 135,-5 142,22 150,23 145,-42" fill="#00E5FF" fill-opacity="0.3"/>

    <!-- LEFT HAND FINGERS & PALM -->
    <path d="M-50,-20 C-30,-35 -5,-35 25,-15 C35,-8 30,10 15,18 C-5,12 -25,2 -45,-5 Z" 
          fill="url(#emeraldGrad)" fill-opacity="0.35" stroke="#00FF97" stroke-width="3" stroke-linejoin="round"/>

    <!-- RIGHT HAND FINGERS -->
    <path d="M10,18 C-10,25 -35,22 -55,10 C-62,5 -58,-8 -45,-12 C-25,-8 0,2 15,10 Z" 
          fill="url(#cyanGrad)" fill-opacity="0.4" stroke="#00E5FF" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M5,32 C-15,38 -40,32 -60,20 C-66,15 -62,3 -48,0 C-30,5 -5,15 10,24 Z" 
          fill="url(#emeraldGrad)" fill-opacity="0.4" stroke="#00FF97" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M-2,46 C-20,50 -45,42 -65,30 C-70,25 -66,14 -52,12 C-35,16 -12,28 3,38 Z" 
          fill="url(#cyanGrad)" fill-opacity="0.4" stroke="#00E5FF" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M-10,58 C-25,60 -48,52 -68,40 C-73,35 -69,25 -56,24 C-40,28 -20,40 -5,50 Z" 
          fill="url(#emeraldGrad)" fill-opacity="0.4" stroke="#00FF97" stroke-width="2" stroke-linejoin="round"/>

    <!-- Handshake Center Light Shimmer -->
    <g transform="translate(-10, 5)">
      <circle cx="0" cy="0" r="10" fill="#FFFFFF" fill-opacity="0.9" filter="url(#emeraldGlow)"/>
      <path d="M-28,0 L28,0 M0,-28 L0,28 M-18,-18 L18,18 M-18,18 L18,-18" 
            stroke="#00FF97" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
    </g>

    <!-- Trust Star Emblem -->
    <polygon points="0,-68 5,-54 20,-54 9,-45 13,-31 0,-39 -13,-31 -9,-45 -20,-54 -5,-54" 
             fill="url(#goldGrad)" stroke="#FFFFFF" stroke-width="0.8" opacity="0.85"/>
  </g>

  <!-- Complete Separation & Dark Backdrop For Logo Slider Area (y: 500-1080) -->
  <rect y="480" width="1920" height="600" fill="#011210" fill-opacity="0.96"/>
  <line x1="0" y1="480" x2="1920" y2="480" stroke="#00FF97" stroke-opacity="0.15" stroke-width="1"/>
</svg>
